name: circuito_descobertas
description: "App do visitante do Circuito de Descobertas"
publish_to: 'none'

# versionName+versionCode do APK
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2960.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logo do Amazon Hacking (web/src/shared/assets/logo-amazon-hacking.svg)
  # em PNG 1x, 2x e 3x, com 32px de altura como na abertura.
  assets:
    - assets/images/

  # Figtree (SIL Open Font License, assets/fonts/OFL.txt), única família do design.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
